<!DOCTYPE html> <!--AVISAR QUE ESTAMOS USANDO A VERSÃO MAIS NOVA DO HTML -->
<html lang = "pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Previsão Do Tempo</title>
</head>

<body>
    <div class="caixa-maior">
        <input class = "input-cidade" placeholder = "Digite o nome da cidade">

        <button onclick = "cliqueiNoBotao()"> <!--Quando clicar faz alguma coisa/chamar a função cliqueiNoBotao-->
            <img class="lupa" src="https://www.svgrepo.com/show/390476/find-search-seo-view-zoom.svg">
        </button>

        <div class = "caixa-media">
            
            <h2 class = "cidade">Tempo em São Paulo</h2>

            <p class = "temp">21°C</p>

            <img class = "icone" src = "https://openweathermap.org/img/wn/04n.png"> 

            <p class = "umidade">Umidade: 70%</p>

        </div>
    </div>
</body>
<script src = "config.js"></script> <!--CARREGA A CHAVE DA API ANTES DO SCRIPT PRINCIPAL-->
<script src = "scripts.js"></script> <!--AVISA QUE O HTML CONECTOU NO JAVA SCRIPT,CONECTOU O JAVA SCRIPT COM O HTML-->

</html>
