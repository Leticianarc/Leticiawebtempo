<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Consulte a previsão do tempo de qualquer cidade do mundo em tempo real.">
    <link rel="stylesheet" href="style.css">
    <title>Previsão do Tempo</title>
</head>

<body>
    <main class="caixa-maior">

        <!-- O <form> faz o Enter funcionar sem JavaScript extra:
             apertar Enter dentro do campo já dispara o evento submit. -->
        <form class="busca" id="form-busca">
            <label class="rotulo-invisivel" for="input-cidade">Nome da cidade</label>
            <input
                class="input-cidade"
                id="input-cidade"
                type="text"
                placeholder="Digite o nome da cidade"
                autocomplete="off">

            <button class="botao-buscar" type="submit" aria-label="Buscar cidade">
                <!-- SVG embutido: não depende de nenhum site externo para carregar -->
                <svg class="lupa" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="16.2" y1="16.2" x2="21" y2="21"></line>
                </svg>
            </button>
        </form>

        <p class="mensagem-erro" id="mensagem-erro" role="alert" hidden></p>

        <p class="carregando" id="carregando" hidden>
            <span class="girando"></span> Buscando previsão...
        </p>

        <section class="caixa-media" id="resultado" hidden>

            <h2 class="cidade"></h2>

            <div class="linha-principal">
                <img class="icone" alt="">
                <p class="temp"></p>
            </div>

            <p class="descricao"></p>

            <dl class="metricas">
                <div class="metrica">
                    <dt>Sensação</dt>
                    <dd class="sensacao"></dd>
                </div>
                <div class="metrica">
                    <dt>Umidade</dt>
                    <dd class="umidade"></dd>
                </div>
                <div class="metrica">
                    <dt>Vento</dt>
                    <dd class="vento"></dd>
                </div>
            </dl>

            <section class="previsao">
                <h3 class="titulo-previsao">Próximos dias</h3>
                <ul class="lista-previsao" id="lista-previsao"></ul>
            </section>

        </section>

    </main>

    <script src="config.js"></script>
    <script src="scripts.js"></script>
</body>

</html>
